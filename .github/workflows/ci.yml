name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite necesita 22+. Es la persistencia del proyecto.
          # Se prueba en 24 (el LTS activo) porque es lo que corre en produccion.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck del server y de la Sala
        run: npm run typecheck

      - name: Que la Sala compile
        run: npm run build

  # Los demos del motor que no necesitan API key ni red: prueban la traducción
  # de formatos entre proveedores y el analizador del back. Los que levantan
  # salas o contenedores quedan fuera — necesitan Docker y varios minutos.
  demos:
    # Fijo y no ubuntu-latest: cuando latest pasó a 26.04, Playwright 1.56.1
    # (el de docker/qa) ya no pudo instalar Chromium ahí y el job se cayó antes
    # de la demo de ver_preview. Se sube cuando se suba Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run demo:providers
      - run: npm run demo:back
      - run: npm run demo:politicas
      - run: npm run demo:actividad
      - run: npm run demo:modo-de-sala
      - run: npm run demo:ver-base
      - run: npm run demo:candados
      - run: npm run demo:agentes-se-ven
      - run: npm run demo:respetar
      - run: npm run demo:preview-caido
      - run: npm run demo:ver-codigo
      - run: npm run demo:sin-espacio
      - run: npm run demo:mensaje-creditos
      # El navegador con el que el agente mira su vista previa. En las salas
      # viene en la imagen; aquí, el de Playwright.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run demo:ver-preview
      - run: npm run demo:internet
      - run: npm run demo:publicar
      - run: npm run demo:proxy-rutas
      - run: npm run demo:remix
      - run: npm run demo:documento
      - run: npm run demo:doc-sync
      - run: npm run demo:comentarios
