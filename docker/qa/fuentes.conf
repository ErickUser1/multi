<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Qué letra real usa el navegador del agente (ver_preview) cuando una página
  pide una genérica.

  `font-family: system-ui, sans-serif` no nombra una letra: dice "la del
  aparato". En un iPhone es San Francisco, en Android Roboto. El contenedor
  no traía ninguna, y fontconfig resolvía las dos a Liberation Mono: el agente
  veía la página con letra de máquina de escribir mientras la gente la veía
  normal, y se ponía a reportar como problema algo que no existía.

  Roboto porque es la del celular que más usa la gente que entra a Multi.
-->
<fontconfig>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Roboto</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>-apple-system</family>
    <prefer><family>Roboto</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>BlinkMacSystemFont</family>
    <prefer><family>Roboto</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Roboto</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Roboto</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
